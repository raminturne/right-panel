<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;padding:16px}</style><h2>My Plugin</h2><button id="count">Loading…</button><script>const b=document.querySelector('#count');RightPanel.storage.get('count').then(n=>{n=n||0;b.textContent=`Clicked ${n} times`;b.onclick=async()=>{n++;await RightPanel.storage.set('count',n);b.textContent=`Clicked ${n} times`}})</script>
