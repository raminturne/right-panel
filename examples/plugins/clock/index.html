<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:18px;color:#fff;background:#202024;font:13px system-ui;text-align:center}.clock{margin:22px 0 4px;font-size:52px;font-weight:250;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.date{color:#9b9ba3}.ring{width:220px;height:220px;margin:16px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#202024 64%,transparent 65%),conic-gradient(#fff var(--p),#ffffff12 0);box-shadow:0 18px 50px #0005}.row{display:flex;justify-content:center;gap:7px}button{border:0;border-radius:999px;padding:8px 13px;background:#ffffff12;color:#fff;cursor:pointer}button.on{background:#fff;color:#18181b}</style><div class="ring" id="ring"><div><div class="clock" id="clock"></div><div class="date" id="date"></div></div></div><div class="row"><button id="h12">12 hour</button><button id="h24">24 hour</button><button id="seconds">Seconds</button></div><script>let mode=24,showSeconds=true;async function load(){mode=await RightPanel.storage.get('mode')||24;showSeconds=(await RightPanel.storage.get('seconds'))??true;draw()}function draw(){const n=new Date(),opt={hour:'2-digit',minute:'2-digit',hour12:mode===12};if(showSeconds)opt.second='2-digit';clock.textContent=n.toLocaleTimeString([],opt);date.textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});ring.style.setProperty('--p',`${n.getSeconds()/60*100}%`);h12.classList.toggle('on',mode===12);h24.classList.toggle('on',mode===24);seconds.classList.toggle('on',showSeconds)}h12.onclick=()=>{mode=12;RightPanel.storage.set('mode',12);draw()};h24.onclick=()=>{mode=24;RightPanel.storage.set('mode',24);draw()};seconds.onclick=()=>{showSeconds=!showSeconds;RightPanel.storage.set('seconds',showSeconds);draw()};load();setInterval(draw,250)</script>
