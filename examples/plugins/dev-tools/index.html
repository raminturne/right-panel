<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;color:#f7f7fa;background:#232326;font:13px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:15px;margin:0}small{color:#909098}.stack{display:grid;gap:9px}.card{padding:12px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff09}.label{color:#9d9da5;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.value{font:12px ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}button{border:0;border-radius:9px;padding:8px 10px;background:#ffffff12;color:#fff;font:600 11px system-ui;cursor:pointer}button:hover{background:#fff;color:#18181b}.primary{background:#fff;color:#18181b}</style><header><div><h1>Developer Tools</h1><small>Quick values, ready to copy</small></div><span>⌘</span></header><div class="stack"><section class="card"><div class="label">UUID v4</div><div class="value" id="uuid"></div><div class="actions"><button onclick="makeUuid()">Regenerate</button><button class="primary" onclick="copy(uuid.textContent)">Copy UUID</button></div></section><section class="card"><div class="label">Unix timestamp</div><div class="value" id="stamp"></div><div class="actions"><button onclick="tick()">Refresh</button><button onclick="copy(stamp.textContent)">Copy timestamp</button></div></section><section class="card"><div class="label">Secure token · 24 bytes</div><div class="value" id="token"></div><div class="actions"><button onclick="makeToken()">Regenerate</button><button onclick="copy(token.textContent)">Copy token</button></div></section></div><script>const copy=async v=>{await RightPanel.clipboard.write(v);RightPanel.ui.showToast('Copied')};function makeUuid(){uuid.textContent=crypto.randomUUID()}function tick(){stamp.textContent=String(Math.floor(Date.now()/1000))}function makeToken(){const b=crypto.getRandomValues(new Uint8Array(24));token.textContent=[...b].map(x=>x.toString(16).padStart(2,'0')).join('')}makeUuid();tick();makeToken()</script>
