<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:18px;color:#fff;background:#202024;font:13px system-ui}.hero{padding:18px;border-radius:18px;background:linear-gradient(145deg,#ffffff12,#ffffff05);border:1px solid #ffffff14;margin-bottom:12px}.mark{font-size:28px}h1{font-size:17px;margin:10px 0 4px}p{color:#97979f;margin:0;line-height:1.5}.field{display:flex;gap:7px;margin-top:16px}input{min-width:0;flex:1;border:1px solid #ffffff18;border-radius:11px;background:#ffffff0c;color:#fff;padding:10px 12px;outline:0}input:focus{border-color:#fff}button{border:0;border-radius:11px;background:#fff;color:#18181b;padding:0 15px;font-weight:700;cursor:pointer}.recent{margin-top:14px}.label{font-size:10px;color:#8d8d96;text-transform:uppercase;letter-spacing:.08em}.item{display:block;width:100%;text-align:left;margin-top:6px;padding:9px 11px;background:#ffffff09;color:#fff;border:0;border-radius:9px;cursor:pointer}</style><section class="hero"><div class="mark">⌘/</div><h1>Open a GitHub repository</h1><p>Jump straight to any public repository without a token.</p><div class="field"><input id="repo" placeholder="owner/repository" autocomplete="off"><button id="open">Open</button></div></section><section class="recent"><div class="label">Recent repositories</div><div id="list"></div></section><script>let recent=[];async function init(){recent=await RightPanel.storage.get('recent')||[];draw()}function draw(){list.innerHTML=recent.length?recent.map(x=>`<button class="item" data-r="${x}">${x}</button>`).join(''):'<p>No recent repositories yet.</p>'}async function go(v){v=v.trim().replace(/^https?:\/\/github.com\//,'').replace(/^\/+|\/+$/g,'');if(!/^[\w.-]+\/[\w.-]+$/.test(v))return RightPanel.ui.showToast('Use owner/repository');recent=[v,...recent.filter(x=>x!==v)].slice(0,4);await RightPanel.storage.set('recent',recent);draw();RightPanel.openUrl('https://github.com/'+v)}open.onclick=()=>go(repo.value);repo.onkeydown=e=>{if(e.key==='Enter')go(repo.value)};list.onclick=e=>{if(e.target.dataset.r)go(e.target.dataset.r)};init()</script>
