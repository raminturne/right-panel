[package]
name = "right-panel"
version = "1.1.0"
edition = "2024"
description = "A liquid side panel for your screen edge: emoji, clipboard, colors, notes, apps and more."
license = "MIT"
repository = "https://github.com/raminturne/right-panel"

[[bin]]
name = "right-panel"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
serde_json = "1.0.151"
tao = "0.37.0"
wry = "0.57.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Power", "Win32_Security"] }

[target.'cfg(not(windows))'.dependencies]
mouse_position = "0.1.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
